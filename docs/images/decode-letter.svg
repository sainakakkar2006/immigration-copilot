<svg xmlns="http://www.w3.org/2000/svg" width="968" height="280" viewBox="0 0 968 280" role="img" aria-label="Decode a Letter flow: upload, Gemini reads, code checks dates, plain answer">
  <title>Decode a Letter flow: upload, Gemini reads, code checks dates, plain answer</title>
  <style>
    .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .ai{fill:#eef4ff;stroke:#9cb8ee;stroke-width:1.2} .code{fill:#eefaf1;stroke:#8fcf9f;stroke-width:1.2}
    .mix{fill:#fff8e6;stroke:#e3c06a;stroke-width:1.2} .bad{fill:#fff0f0;stroke:#e59a9a;stroke-width:1.2}
    .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .muted{fill:#59636e} .h{font-weight:600} .red{fill:#b42318} .green{fill:#1a7f37} .blue{fill:#1f5fbf}
    .ln{stroke:#59636e;stroke-width:1.6;fill:none} .lnred{stroke:#b42318;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .ah{fill:#59636e} .ahred{fill:#b42318}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .card{fill:#161b22;stroke:#3d444d}
      .ai{fill:#13233f;stroke:#3b5f9e} .code{fill:#11291a;stroke:#2f7a45}
      .mix{fill:#2b2410;stroke:#8a6d1f} .bad{fill:#2d1416;stroke:#a04545}
      .t,.m{fill:#e6edf3} .muted{fill:#9198a1} .red{fill:#ff7b72} .green{fill:#56d364} .blue{fill:#79b8ff}
      .ln{stroke:#9198a1} .ah{fill:#9198a1} .lnred{stroke:#ff7b72} .ahred{fill:#ff7b72}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahred" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="968" height="280" rx="10"/>
  <text class="t h" x="24" y="40" font-size="17" text-anchor="start">Decode a Letter: what happens to one notice</text>
  <rect class="card" x="24" y="70" width="206" height="128" rx="8"/>
  <text class="t h" x="38" y="98" font-size="14" text-anchor="start">1. You upload a letter</text>
  <text class="t muted" x="38" y="126" font-size="12.5" text-anchor="start">A phone photo or PDF of a</text>
  <text class="t muted" x="38" y="145" font-size="12.5" text-anchor="start">notice: receipt, RFE, NOID,</text>
  <text class="t muted" x="38" y="164" font-size="12.5" text-anchor="start">denial, interview notice</text>
  <path class="ln" d="M232 134 L256 134" marker-end="url(#a)"/>
  <rect class="ai" x="260" y="70" width="206" height="128" rx="8"/>
  <text class="t h" x="274" y="98" font-size="14" text-anchor="start">2. Gemini reads it</text>
  <text class="t muted" x="274" y="126" font-size="12.5" text-anchor="start">One multimodal call,</text>
  <text class="t muted" x="274" y="145" font-size="12.5" text-anchor="start">no OCR step. It must</text>
  <text class="t muted" x="274" y="164" font-size="12.5" text-anchor="start">answer in a fixed JSON shape</text>
  <path class="ln" d="M468 134 L492 134" marker-end="url(#a)"/>
  <rect class="mix" x="496" y="70" width="206" height="128" rx="8"/>
  <text class="t h" x="510" y="98" font-size="14" text-anchor="start">3. Code checks it</text>
  <text class="t muted" x="510" y="126" font-size="12.5" text-anchor="start">Every date must parse as</text>
  <text class="t muted" x="510" y="145" font-size="12.5" text-anchor="start">YYYY-MM-DD or it is dropped.</text>
  <text class="t muted" x="510" y="164" font-size="12.5" text-anchor="start">Nothing is saved to disk</text>
  <path class="ln" d="M704 134 L728 134" marker-end="url(#a)"/>
  <rect class="code" x="732" y="70" width="206" height="128" rx="8"/>
  <text class="t h" x="746" y="98" font-size="14" text-anchor="start">4. You get a plain answer</text>
  <text class="t muted" x="746" y="126" font-size="12.5" text-anchor="start">What the letter is, what it</text>
  <text class="t muted" x="746" y="145" font-size="12.5" text-anchor="start">means, next steps, deadlines</text>
  <text class="t muted" x="746" y="164" font-size="12.5" text-anchor="start">and a calendar (.ics) file</text>
  <text class="t muted" x="24" y="236" font-size="12.5" text-anchor="start">If the letter looks like a denial, a NOID, a court notice or anything about deportation, the answer also links free legal aid.</text>
  <text class="t muted" x="24" y="258" font-size="12.5" text-anchor="start">Explanations come back at a 5th-grade reading level, in whichever of the 12 interface languages is selected.</text>
</svg>
