<svg xmlns="http://www.w3.org/2000/svg" width="968" height="302" viewBox="0 0 968 302" role="img" aria-label="OPT timeline for a May 15 2027 program end: window opens Feb 14, closes Jul 14 2027">
  <title>OPT timeline for a May 15 2027 program end: window opens Feb 14, closes Jul 14 2027</title>
  <style>
    .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .ai{fill:#eef4ff;stroke:#9cb8ee;stroke-width:1.2} .code{fill:#eefaf1;stroke:#8fcf9f;stroke-width:1.2}
    .mix{fill:#fff8e6;stroke:#e3c06a;stroke-width:1.2} .bad{fill:#fff0f0;stroke:#e59a9a;stroke-width:1.2}
    .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .muted{fill:#59636e} .h{font-weight:600} .red{fill:#b42318} .green{fill:#1a7f37} .blue{fill:#1f5fbf}
    .ln{stroke:#59636e;stroke-width:1.6;fill:none} .lnred{stroke:#b42318;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .ah{fill:#59636e} .ahred{fill:#b42318}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .card{fill:#161b22;stroke:#3d444d}
      .ai{fill:#13233f;stroke:#3b5f9e} .code{fill:#11291a;stroke:#2f7a45}
      .mix{fill:#2b2410;stroke:#8a6d1f} .bad{fill:#2d1416;stroke:#a04545}
      .t,.m{fill:#e6edf3} .muted{fill:#9198a1} .red{fill:#ff7b72} .green{fill:#56d364} .blue{fill:#79b8ff}
      .ln{stroke:#9198a1} .ah{fill:#9198a1} .lnred{stroke:#ff7b72} .ahred{fill:#ff7b72}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahred" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="968" height="302" rx="10"/>
  <text class="t h" x="24" y="40" font-size="17" text-anchor="start">OPT deadlines, computed in Python</text>
  <text class="m muted" x="24" y="64" font-size="12" text-anchor="start">Real output of build_opt_deadlines("student", date(2027, 5, 15), stem_eligible=True)</text>
  <path class="ln" d="M60 150 L908 150"/>
  <circle class="card" cx="120" cy="150" r="9"/>
  <circle cx="120" cy="150" r="4" class="ah"/>
  <text class="t h blue" x="120" y="128" font-size="14" text-anchor="middle">Feb 14, 2027</text>
  <text class="t" x="120" y="182" font-size="12.5" text-anchor="middle">Earliest day USCIS can</text>
  <text class="t" x="120" y="200" font-size="12.5" text-anchor="middle">receive Form I-765</text>
  <text class="t" x="120" y="218" font-size="12.5" text-anchor="middle">(program end minus 90 days)</text>
  <circle class="card" cx="557" cy="150" r="9"/>
  <circle cx="557" cy="150" r="4" class="ah"/>
  <text class="t h t" x="557" y="128" font-size="14" text-anchor="middle">May 15, 2027</text>
  <text class="t" x="557" y="182" font-size="12.5" text-anchor="middle">Program end date</text>
  <text class="t" x="557" y="200" font-size="12.5" text-anchor="middle">on the I-20</text>
  <circle class="card" cx="848" cy="150" r="9"/>
  <circle cx="848" cy="150" r="4" class="ah"/>
  <text class="t h red" x="848" y="128" font-size="14" text-anchor="middle">Jul 14, 2027</text>
  <text class="t" x="848" y="182" font-size="12.5" text-anchor="middle">Last day USCIS can receive</text>
  <text class="t" x="848" y="200" font-size="12.5" text-anchor="middle">it. Also the end of the</text>
  <text class="t" x="848" y="218" font-size="12.5" text-anchor="middle">60-day grace period</text>
  <text class="t muted" x="338" y="142" font-size="12" text-anchor="middle">90 days</text>
  <text class="t muted" x="702" y="142" font-size="12" text-anchor="middle">60 days</text>
  <text class="t muted" x="24" y="262" font-size="12.5" text-anchor="start">Window rules from the USCIS OPT page: apply up to 90 days before you complete your degree, no later than 60 days after.</text>
  <text class="t muted" x="24" y="282" font-size="12.5" text-anchor="start">Gemini only explains these dates after they are computed. It never produces them.</text>
</svg>
