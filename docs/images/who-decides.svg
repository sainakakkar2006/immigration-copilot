<svg xmlns="http://www.w3.org/2000/svg" width="968" height="310" viewBox="0 0 968 310" role="img" aria-label="Three zones: what Gemini writes, what Gemini reads and code checks, what only code does">
  <title>Three zones: what Gemini writes, what Gemini reads and code checks, what only code does</title>
  <style>
    .bg{fill:#ffffff} .card{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1.2}
    .ai{fill:#eef4ff;stroke:#9cb8ee;stroke-width:1.2} .code{fill:#eefaf1;stroke:#8fcf9f;stroke-width:1.2}
    .mix{fill:#fff8e6;stroke:#e3c06a;stroke-width:1.2} .bad{fill:#fff0f0;stroke:#e59a9a;stroke-width:1.2}
    .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2328}
    .muted{fill:#59636e} .h{font-weight:600} .red{fill:#b42318} .green{fill:#1a7f37} .blue{fill:#1f5fbf}
    .ln{stroke:#59636e;stroke-width:1.6;fill:none} .lnred{stroke:#b42318;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
    .ah{fill:#59636e} .ahred{fill:#b42318}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .card{fill:#161b22;stroke:#3d444d}
      .ai{fill:#13233f;stroke:#3b5f9e} .code{fill:#11291a;stroke:#2f7a45}
      .mix{fill:#2b2410;stroke:#8a6d1f} .bad{fill:#2d1416;stroke:#a04545}
      .t,.m{fill:#e6edf3} .muted{fill:#9198a1} .red{fill:#ff7b72} .green{fill:#56d364} .blue{fill:#79b8ff}
      .ln{stroke:#9198a1} .ah{fill:#9198a1} .lnred{stroke:#ff7b72} .ahred{fill:#ff7b72}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahred" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="968" height="310" rx="10"/>
  <text class="t h" x="24" y="40" font-size="17" text-anchor="start">Where the AI is allowed to decide, and where it is not</text>
  <rect class="ai" x="24" y="62" width="296" height="196" rx="8"/>
  <text class="t h blue" x="40" y="92" font-size="15" text-anchor="start">Gemini writes it</text>
  <text class="t" x="40" y="122" font-size="12.5" text-anchor="start">Plain-language explanations</text>
  <text class="t" x="40" y="143" font-size="12.5" text-anchor="start">Interface translation (12 languages,</text>
  <text class="t" x="40" y="164" font-size="12.5" text-anchor="start">  cached once per language)</text>
  <text class="t" x="40" y="185" font-size="12.5" text-anchor="start">News summaries, with search citations</text>
  <text class="t" x="40" y="206" font-size="12.5" text-anchor="start">Your Situation assessment</text>
  <text class="t" x="40" y="227" font-size="12.5" text-anchor="start">Green card checklist and cover letter</text>
  <rect class="mix" x="334" y="62" width="296" height="196" rx="8"/>
  <text class="t h t" x="350" y="92" font-size="15" text-anchor="start">Gemini reads it, code checks it</text>
  <text class="t" x="350" y="122" font-size="12.5" text-anchor="start">Dates printed on an uploaded letter:</text>
  <text class="t" x="350" y="143" font-size="12.5" text-anchor="start">  kept only if they parse as a real</text>
  <text class="t" x="350" y="164" font-size="12.5" text-anchor="start">  YYYY-MM-DD date</text>
  <text class="t" x="350" y="185" font-size="12.5" text-anchor="start">Every response: parsed as JSON before</text>
  <text class="t" x="350" y="206" font-size="12.5" text-anchor="start">  anything is shown on the page</text>
  <rect class="code" x="644" y="62" width="296" height="196" rx="8"/>
  <text class="t h green" x="660" y="92" font-size="15" text-anchor="start">Code only, no AI</text>
  <text class="t" x="660" y="122" font-size="12.5" text-anchor="start">OPT and STEM OPT deadline math</text>
  <text class="t" x="660" y="143" font-size="12.5" text-anchor="start">  (90 days before, 60 days after)</text>
  <text class="t" x="660" y="164" font-size="12.5" text-anchor="start">.ics calendar files with a 14-day</text>
  <text class="t" x="660" y="185" font-size="12.5" text-anchor="start">  reminder</text>
  <text class="t" x="660" y="206" font-size="12.5" text-anchor="start">Fetching government news and</text>
  <text class="t" x="660" y="227" font-size="12.5" text-anchor="start">  the first keyword filter for immigration news</text>
  <text class="t muted" x="24" y="290" font-size="12.5" text-anchor="start">A wrong explanation is bad. A wrong deadline can cost someone their status, so OPT deadline dates are computed in code, never by the model.</text>
</svg>
